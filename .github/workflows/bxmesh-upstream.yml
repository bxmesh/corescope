# Each morning, checks for a new upstream CoreScope release. If there's one this fork hasn't
# merged (bxmesh/UPSTREAM_RELEASE), it opens an issue saying so, once per release. Merging it is a
# pull request made with bxmesh/sync.sh, which the owner approves (BXMESH.md, O292); nothing here
# changes the code.
name: upstream

on:
  schedule:
    - cron: '0 21 * * *'   # 07:00 or 08:00 in Bathurst
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: New upstream release?
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: Kpa-clawbot/CoreScope
        run: |
          set -eu
          ours=$(cat bxmesh/UPSTREAM_RELEASE)
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "ours $ours, upstream's latest $latest"
          [ "$latest" = "$ours" ] && exit 0
          newest=$(printf '%s\n%s\n' "${ours#v}" "${latest#v}" | sort -V | tail -1)
          [ "v$newest" = "$latest" ] || { echo "upstream's latest is older than ours"; exit 0; }
          title="Upstream CoreScope $latest"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "already raised"; exit 0
          fi
          {
            echo "Upstream released [$latest](https://github.com/$UPSTREAM/releases/tag/$latest); this fork is on $ours."
            echo
            echo "1. Read its changelog. Does upstream now start Inferred Hops off, or have a setting for it? Then the fork has done its job: archive it and put corescope.bxmesh.net back on upstream's image (BXMESH.md)."
            echo "2. Otherwise, \`bxmesh/sync.sh $latest\`, then a pull request to \`bxmesh\` with the changelog, risks and rollback."
            echo "3. Once that's merged and built, Renovate opens the bump in corescope.bxmesh.net."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
