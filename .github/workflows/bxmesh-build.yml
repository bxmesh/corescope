# BXMesh's build of CoreScope: upstream's release (bxmesh/UPSTREAM_RELEASE) with our patch
# (BXMESH.md). A pull request to bxmesh tests and builds without pushing; a merge to bxmesh pushes
# ghcr.io/bxmesh/corescope:<release>-bxmesh, which corescope.bxmesh.net's Dockerfile builds on,
# pinned by digest. Renovate opens that bump there; the owner merges and syncs it (O14, O292).
#
# Upstream's own workflows are not in this fork: their release, deploy and issue bots are theirs.
# GitHub-hosted runners: this repo is public (T13).
name: build

on:
  pull_request:
    branches: [bxmesh]
  push:
    branches: [bxmesh]

permissions: {}

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # ghcr.io/bxmesh/corescope, on a push to bxmesh only
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      IMAGE: ghcr.io/bxmesh/corescope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Our patch must still be there after every upstream merge: these fail if it's gone.
      - name: Test the live page
        run: node tests/unit/test-live.js

      - name: Version
        id: meta
        run: |
          set -eu
          release=$(cat bxmesh/UPSTREAM_RELEASE)
          echo "$release" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad release '$release'" >&2; exit 1; }
          echo "tag=${release}-bxmesh" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=GPL-3.0
